[settings]
auto_update = false

[hooks]
# 安装/升级 code-server 后自动把本机 Nerd Font 注入其 workbench.css，
# 让手机浏览器终端也能显示 Nerd Font（详见 ~/.local/bin/code-server-font-patch.sh）。
#
# 这里只负责“每次 postinstall 都调一次脚本”，不掺业务逻辑：脚本自己看
# MISE_INSTALLED_TOOLS 判断本次装的是不是 code-server、目标目录该用哪个
# （为什么不能用 installs/…/latest，见那个脚本里的注释）。hook 里只留路径存在性检查，
# 避免 dotfiles 没 clone/没执行位时静默失败。
postinstall = '''
script="$HOME/.local/bin/code-server-font-patch.sh"
if [ -x "$script" ]; then
  "$script"
else
  echo 'code-server-font-patch.sh 不存在，跳过字体注入' >&2
fi
'''
