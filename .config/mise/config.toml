# code-server 装/升级后往它的 workbench.css 注入本机 Nerd Font（详见
# ~/.local/bin/code-server-font-patch.sh）。用 tool-level postinstall 而不是
# [hooks] postinstall：
#   * 只在这个工具真正安装/升级时触发，别的工具安装不会把它叫起来（when 默认 install）；
#   * mise 会注入 MISE_TOOL_INSTALL_PATH（本次安装的精确目录）。不能用
#     installs/…/latest：postinstall 跑在 mise 重建 floating runtime symlink 之前，
#     此刻 latest 要么还不存在（首次安装），要么还指着上一版（升级）。
# 副作用：脚本失败（字体缺失、uvx 失败）会让这次 code-server 安装报错——这是故意的，
# 总比默默不生效、下次升级才发现要好。脚本不存在时只警告，不拖垮安装。
[tools."github:coder/code-server"]
version = "latest"
postinstall = '''
script="$HOME/.local/bin/code-server-font-patch.sh"
if [ -x "$script" ]; then
  "$script"
else
  echo 'code-server-font-patch.sh 不存在，跳过字体注入' >&2
fi
'''

[settings]
auto_update = false
