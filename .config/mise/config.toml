[tools]
7zip = "latest"
"aqua:ViRb3/wgcf" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bat = "latest"
# btop (installed via aqua) extracts the upstream release tarball to
# $MISE_TOOL_INSTALL_PATH/btop/{bin, themes}, but btop only searches for system
# themes at <binary_dir>/../share/btop/themes. Without this symlink btop sees
# only the built-in Default/TTY themes instead of the bundled 41. The postinstall
# recreates the symlink after every install/upgrade. Do not remove.
btop = { version = "latest", postinstall = "mkdir -p \"$MISE_TOOL_INSTALL_PATH/btop/share/btop\" && ln -sfn ../../themes \"$MISE_TOOL_INSTALL_PATH/btop/share/btop/themes\"" }
bun = "latest"
cargo-binstall = "latest"
"cargo:tree-sitter-cli" = "latest"
delta = "latest"
fastfetch = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
"github:h4ckf0r0day/obscura" = { version = "latest", asset_pattern = "obscura-x86_64-linux-stealth.tar.gz" }
"github:iOfficeAI/OfficeCLI" = "latest"
"github:mikeleppane/envx" = "latest"
"github:pkgforge-dev/ghostty-appimage" = { version = "latest", asset_pattern = "Ghostty-{{ version }}-x86_64.AppImage", bin = "ghostty" }
"github:rgwood/systemctl-tui" = "latest"
imagemagick = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
mpv = "latest"
neovim = "latest"
node = "26"
"npm:@agegr/pi-web" = "latest"
"npm:@earendil-works/pi-coding-agent" = { version = "latest", minimum_release_age = "6h" }
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:prettier" = "latest"
onefetch = "latest"
opencode = "latest"
opentofu = "1.12"
"pipx:hike" = "latest"
"pipx:ricardoakrug/nyancat-cli" = "latest"
podman-tui = "latest"
poppler = "latest"
resvg = "latest"
ripgrep = "latest"
topgrade = "latest"
uv = "latest"
yazi = "latest"
zoxide = "latest"

[settings]
auto_update = true
