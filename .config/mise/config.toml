# Injects this machine's Nerd Font into code-server's workbench.css once the tool is
# installed/upgraded (see ~/.local/bin/code-server-font-patch.sh). Uses a tool-level
# postinstall instead of [hooks] postinstall:
#   * fires only for this tool's real install/upgrade, never when other tools install
#     (when defaults to install);
#   * mise injects MISE_TOOL_INSTALL_PATH, the exact install dir for this run. `latest`
#     is not usable here: postinstall runs before mise rebuilds its floating runtime
#     symlinks, so latest either does not exist yet (first install) or still points at
#     the previous version (upgrade).
# Trade-off: a failing script (missing font, uvx failure) fails this code-server install
# — on purpose, since silently doing nothing is exactly how this broke before. A missing
# script only warns and never breaks the install.
[tools."github:coder/code-server"]
version = "latest"
postinstall = '''
script="$HOME/.local/bin/code-server-font-patch.sh"
if [ -x "$script" ]; then
  "$script"
else
  echo 'code-server-font-patch.sh not found, skipping font injection' >&2
fi
'''

[settings]
auto_update = false
